name: internly — Daily Outreach
on:
  schedule:
    - cron: '0 8 * * *'  # 8 AM UTC daily
  workflow_dispatch:       # manual trigger

jobs:
  outreach:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run internly
        run: python internly.py daily-run
        env:
          ZEN_API_KEY: ${{ secrets.ZEN_API_KEY }}
          GOOGLE_GMAIL_CLIENT_ID: ${{ secrets.GOOGLE_GMAIL_CLIENT_ID }}
          GOOGLE_GMAIL_CLIENT_SECRET: ${{ secrets.GOOGLE_GMAIL_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          YOUR_NAME: ${{ secrets.YOUR_NAME }}
          YOUR_LINK: ${{ secrets.YOUR_LINK }}
          YOUR_GITHUB: ${{ secrets.YOUR_GITHUB }}
          YOUR_PITCH: ${{ secrets.YOUR_PITCH }}
          DAILY_LIMIT: 25
          SEND_DELAY: 2.0
